name: Build profile card
on:
  push:
    branches: [main]
    paths-ignore: ["*.svg", "stats_cache.json"]
  schedule:
    - cron: "17 4 * * *"   # daily, 05:17 Buea time
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}   # optional, see SETUP.md
          GITHUB_TOKEN: ${{ github.token }}
        run: python generate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg stats_cache.json
          git diff --cached --quiet || (git commit -m "Update profile card" && git push)
